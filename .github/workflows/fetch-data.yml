name: Fetch Google Ads Data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6am UTC

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install package
        run: uv pip install --system -e .

      - name: Fetch Google Ads data
        env:
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
        run: |
          # google-ads makes its API calls through grpcio, which ships its own CA
          # list. Every grpcio release through 1.84.0 still trusts the compromised
          # eMudhra root "emSign ECC Root CA - G3", so point gRPC at certifi's CA
          # list instead (certifi 2026.10.19 and later no longer include it).
          # The assignment is kept separate from the export so that a failure of
          # `python -m certifi` fails this step instead of leaving the path empty.
          GRPC_DEFAULT_SSL_ROOTS_FILE_PATH="$(python -m certifi)"
          export GRPC_DEFAULT_SSL_ROOTS_FILE_PATH
          fetch-ads-data

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          git diff --staged --quiet || git commit -m "Update Google Ads data [automated]"
          git push
